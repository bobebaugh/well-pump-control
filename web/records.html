<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09111f">
  <title>Durable records — Well Pump Monitoring</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/record-reasons.js" defer></script>
  <script src="/records.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">PRIVATE WELL · OBSERVATIONAL PILOT</p><h1>Durable records</h1></div>
    <div class="topbar-actions"><a class="nav-link" href="/">Home</a><a class="nav-link" href="/rules-engine.html">Rules Engine</a></div>
  </header>
  <main class="records-main">
    <section class="panel records-toolbar">
      <div><p class="kicker">OBSERVATION TIME</p><h2>Durable observation browser</h2><small id="timezone-label"></small></div>
      <div class="records-controls">
        <div class="records-actions">
          <button id="latest-records" class="primary-button" type="button">Latest</button>
          <button id="receipt-records" class="secondary-button" type="button" title="List records by when the cloud received them instead of by device time. Records written before the Tab5 clock synchronized have no device time, so they appear only here or through session navigation.">Receipt-time fallback</button>
          <button id="older-records" class="secondary-button" type="button">Older</button>
          <button id="newer-records" class="secondary-button" type="button" disabled>Newer</button>
        </div>
        <div class="records-actions range-actions">
          <label id="range-custom">From (local)<input id="range-from" type="datetime-local"></label>
          <label id="range-custom-to">To (local)<input id="range-to" type="datetime-local" title="Follows the current time until you change it"></label>
          <button id="range-8h" class="secondary-button range-choice" type="button">Last 8 h</button>
          <button id="range-today" class="secondary-button range-choice" type="button">Today</button>
          <button id="range-day" class="secondary-button range-choice" type="button">Last 24 h</button>
          <button id="range-week" class="secondary-button range-choice" type="button">Last 7 days</button>
          <label id="event-choice">Event<select id="event-select"><option value="">Events in this range</option></select></label>
          <label class="inline-check" title="Export only the rows the Show filter keeps, and only the columns shown"><input id="export-shown" type="checkbox">As shown</label>
          <button id="export-range" class="primary-button" type="button">Export CSV</button>
        </div>
      </div>
    </section>
    <p id="records-status" class="browser-status" aria-live="polite">Loading durable records…</p>
    <section class="panel column-panel"><div><p class="kicker">FIELDS IN THESE RECORDS</p><h2>Columns</h2></div><div id="column-picker" class="column-picker"></div></section>
    <section class="panel records-table-panel"><div id="records-table" class="records-table"></div></section>
    <section id="history-panel" class="panel history-panel" hidden><div class="panel-heading"><div><p class="kicker">EVENT HISTORY</p><h2>Occurrences</h2></div></div><div id="history-list" class="event-list"></div><div class="history-actions"><button id="history-newer" class="secondary-button" type="button" disabled>Newer closures</button><button id="history-older" class="secondary-button" type="button" disabled>Older closures</button></div></section>
  </main>
</body>
</html>
