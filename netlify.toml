[build]
  publish = "web"
  functions = "cloud/netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["cloud/netlify/rules-releases/**"]

[[redirects]]
  from = "/.netlify/functions/rules-release/:releaseId"
  to = "/.netlify/functions/rules-release?releaseId=:releaseId"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
